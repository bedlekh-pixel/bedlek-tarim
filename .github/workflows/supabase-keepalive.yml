name: Supabase Keep-Alive

on:
  schedule:
    # Her 3 günde bir — Supabase'in 7 günlük inaktivite duraklatmasını engeller
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase'e istek gönder
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/store?select=key&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
